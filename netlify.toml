[build]
  publish = "."
    functions = "netlify/functions"

    [functions]
      node_bundler = "esbuild"

      # META_PIXEL_ID y META_AD_ACCOUNT_ID son IDs publicos, no secretos, pero el
      # escaner de secretos de Netlify a veces igual los marca y bloquea el deploy.
      # Los excluimos explicitamente del escaneo.
      [build.environment]
        SECRETS_SCAN_OMIT_KEYS = "META_PIXEL_ID,META_AD_ACCOUNT_ID"

        [[headers]]
          for = "/*"
            [headers.values]
                X-Frame-Options = "DENY"
                    X-Content-Type-Options = "nosniff"
                        Referrer-Policy = "strict-origin-when-cross-origin"
