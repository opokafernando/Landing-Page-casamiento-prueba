<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel · The Wedding Project</title>
<link rel="icon" type="image/png" href="https://res.cloudinary.com/drfoww3ch/image/upload/w_64,h_64,c_pad,b_rgb:221D18,f_png/Firma_Blanca_gc6x1k.png">
<style>
  :root{
    --bg:#F5F2EC; --surface:#FFFFFF; --ink:#1D1A17; --ink-2:#5E554B; --ink-3:#8C8379;
    --line:rgba(29,26,23,0.09); --line-2:rgba(29,26,23,0.16);
    --accent:#9A7A4C; --accent-ink:#7A5E36; --accent-soft:rgba(154,122,76,0.12);
    --ok:#2E7D4F; --warn:#B4541F; --danger:#C2382B;
    --r-lg:18px; --r-md:12px; --r-sm:9px;
    --shadow:0 1px 2px rgba(29,26,23,0.05), 0 8px 24px rgba(29,26,23,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{font:15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;}
  h1,h2,h3{letter-spacing:-0.015em; line-height:1.15;}
  button, input, select, textarea{font:inherit; color:inherit;}
  button{cursor:pointer;}
  [hidden]{display:none !important;}

  /* Botones */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:999px; padding:9px 16px; font-weight:600; font-size:0.9rem; background:var(--ink); color:#fff; transition:transform 0.1s ease-out, background 0.2s ease, opacity 0.2s ease;}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.4; cursor:default; transform:none;}
  .btn.secondary{background:rgba(29,26,23,0.07); color:var(--ink);}
  .btn.ghost{background:transparent; color:var(--accent-ink); padding:8px 10px;}
  .btn.danger{background:rgba(194,56,43,0.1); color:var(--danger);}
  .btn.small{padding:6px 12px; font-size:0.82rem;}
  .btn:focus-visible, .field:focus-visible, .nav-item:focus-visible{outline:3px solid rgba(154,122,76,0.45); outline-offset:2px;}

  /* Ingreso */
  .login{min-height:100svh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{width:100%; max-width:380px; background:var(--surface); border-radius:24px; padding:34px 28px; box-shadow:var(--shadow); text-align:center;}
  .login-card img{width:56px; height:56px; border-radius:14px; margin-bottom:16px;}
  .login-card h1{font-size:1.5rem; margin-bottom:6px;}
  .login-card p{color:var(--ink-2); font-size:0.9rem; margin-bottom:22px;}
  .login-card form{display:flex; flex-direction:column; gap:12px;}
  .error{color:var(--danger); font-size:0.85rem; min-height:1.2em;}

  /* Estructura */
  .app{display:grid; grid-template-columns:240px 1fr; min-height:100svh;}
  @media (max-width:820px){ .app{grid-template-columns:1fr;} }
  .side{position:sticky; top:0; height:100svh; padding:20px 14px; border-right:1px solid var(--line); background:rgba(245,242,236,0.7); -webkit-backdrop-filter:blur(20px) saturate(170%); backdrop-filter:blur(20px) saturate(170%); display:flex; flex-direction:column; gap:4px;}
  @media (max-width:820px){ .side{position:sticky; top:0; z-index:30; height:auto; flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); padding:10px; gap:6px;} .side .brand{display:none;} .side .side-foot{display:none;} }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px;}
  .brand img{width:30px; height:30px; border-radius:8px;}
  .brand b{font-size:0.95rem; letter-spacing:-0.01em;}
  .brand span{display:block; font-size:0.75rem; color:var(--ink-3);}
  .nav-item{display:flex; align-items:center; gap:10px; padding:9px 12px; border:none; background:none; border-radius:10px; text-align:left; font-weight:500; color:var(--ink-2); white-space:nowrap; transition:background 0.15s ease;}
  .nav-item:hover{background:rgba(29,26,23,0.05);}
  .nav-item.is-active{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(29,26,23,0.06);}
  .nav-item svg{width:18px; height:18px; flex-shrink:0; color:var(--accent);}
  .side-foot{margin-top:auto; font-size:0.78rem; color:var(--ink-3); padding:8px 10px;}
  .side-foot a{color:var(--accent-ink);}

  .main{min-width:0;}
  .topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 28px; background:rgba(245,242,236,0.72); -webkit-backdrop-filter:blur(20px) saturate(170%); backdrop-filter:blur(20px) saturate(170%); border-bottom:1px solid var(--line);}
  @media (max-width:820px){ .topbar{top:57px; padding:10px 14px;} }
  .topbar h2{font-size:1.25rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pending{display:inline-flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--ink-2);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--ink-3);}
  .pending.has .dot{background:var(--warn);}
  .content{padding:24px 28px 80px; max-width:1100px;}
  @media (max-width:820px){ .content{padding:16px 14px 80px;} }

  .card{background:var(--surface); border-radius:var(--r-lg); padding:20px; box-shadow:var(--shadow); margin-bottom:16px;}
  .card h3{font-size:1.05rem; margin-bottom:4px;}
  .muted{color:var(--ink-2); font-size:0.88rem;}
  .tiny{color:var(--ink-3); font-size:0.78rem;}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .grow{flex:1;}
  .field{width:100%; border:1px solid var(--line-2); border-radius:var(--r-sm); background:#fff; padding:9px 11px; transition:border-color 0.15s ease, box-shadow 0.15s ease;}
  .field:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  textarea.field{resize:vertical; min-height:44px; line-height:1.45;}
  label.lbl{display:block; font-size:0.75rem; font-weight:600; color:var(--ink-2); margin-bottom:5px; letter-spacing:0.01em;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  @media (max-width:900px){ .grid3{grid-template-columns:1fr;} }
  .grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media (max-width:700px){ .grid2{grid-template-columns:1fr;} }
  .seg{display:inline-flex; background:rgba(29,26,23,0.06); border-radius:10px; padding:3px;}
  .seg button{border:none; background:none; padding:6px 12px; border-radius:8px; font-size:0.85rem; font-weight:500; color:var(--ink-2);}
  .seg button.is-on{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,0.08);}
  .lang-tag{display:inline-block; font-size:0.7rem; font-weight:700; letter-spacing:0.05em; color:var(--accent-ink); background:var(--accent-soft); border-radius:6px; padding:1px 6px; margin-right:4px;}

  /* Textos */
  .key-block{padding:14px 0; border-top:1px solid var(--line);}
  .key-block:first-of-type{border-top:none;}
  .key-name{font-family:ui-monospace, "SF Mono", Menlo, monospace; font-size:0.74rem; color:var(--ink-3); margin-bottom:6px;}
  .key-block.is-changed .key-name::after{content:" · cambiado"; color:var(--warn); font-family:inherit;}
  .group-title{font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent-ink); margin:22px 0 8px;}

  /* Tabla de precios */
  .price-row{display:grid; grid-template-columns:1.4fr 1fr 1fr 1.6fr; gap:10px; align-items:center; padding:12px 0; border-top:1px solid var(--line);}
  .price-row:first-child{border-top:none;}
  @media (max-width:700px){ .price-row{grid-template-columns:1fr 1fr;} .price-row .p-name, .price-row .p-calc{grid-column:1/-1;} }
  .money{position:relative;}
  .money span{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-3); font-size:0.85rem;}
  .money input{padding-left:34px;}

  /* Lista ordenable */
  .item{border:1px solid var(--line); border-radius:var(--r-md); padding:14px; margin-bottom:12px; background:#fff;}
  .item-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .item-head b{flex:1;}
  .icon-btn{width:32px; height:32px; border-radius:50%; border:none; background:rgba(29,26,23,0.06); display:inline-flex; align-items:center; justify-content:center; transition:transform 0.1s ease-out;}
  .icon-btn:active{transform:scale(0.92);}
  .icon-btn:disabled{opacity:0.3;}

  /* Galerías */
  .gal-list{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px;}
  .gal-card{border-radius:var(--r-lg); overflow:hidden; background:#fff; box-shadow:var(--shadow); border:none; text-align:left; padding:0; transition:transform 0.15s ease-out;}
  .gal-card:active{transform:scale(0.98);}
  .gal-card img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#e9e3d8;}
  .gal-card div{padding:10px 12px 12px;}
  .gal-card b{display:block;}
  .gal-new{display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; min-height:200px; border:2px dashed var(--line-2); background:transparent; box-shadow:none; color:var(--accent-ink); font-weight:600;}
  .thumbs{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px; margin-top:12px;}
  .thumb{position:relative; border-radius:10px; overflow:hidden; background:#e9e3d8; aspect-ratio:1; border:2px solid transparent; padding:0; transition:transform 0.1s ease-out;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;}
  .thumb.is-drag{opacity:0.35;}
  .thumb.is-over{border-color:var(--accent);}
  .thumb .badges{position:absolute; left:4px; top:4px; display:flex; gap:3px;}
  .thumb .badges i{font-style:normal; font-size:0.65rem; font-weight:700; background:var(--ink); color:#fff; border-radius:5px; padding:1px 5px;}
  .thumb .num{position:absolute; right:4px; bottom:4px; font-size:0.65rem; color:#fff; background:rgba(0,0,0,0.45); border-radius:5px; padding:1px 5px;}
  .thumb-menu{position:fixed; z-index:80; background:rgba(255,255,255,0.86); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); border:1px solid rgba(255,255,255,0.7); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,0.18); padding:6px; min-width:210px; transform-origin:top left; animation:menuIn 0.18s cubic-bezier(.2,.8,.2,1);}
  .thumb-menu button{display:block; width:100%; text-align:left; border:none; background:none; padding:9px 12px; border-radius:9px; font-size:0.9rem;}
  .thumb-menu button:hover{background:rgba(29,26,23,0.06);}
  .thumb-menu .del{color:var(--danger);}
  @keyframes menuIn{from{opacity:0; transform:scale(0.96);} to{opacity:1; transform:none;}}
  .cover-prev{display:grid; grid-template-columns:2fr 1fr; gap:10px; margin-top:10px;}
  .cover-prev figure{border-radius:12px; overflow:hidden; background:#e9e3d8;}
  .cover-prev img{width:100%; display:block; object-fit:cover;}
  .cover-prev figcaption{font-size:0.75rem; color:var(--ink-2); padding:6px 8px; background:#fff;}

  /* Hoja modal */
  .scrim{position:fixed; inset:0; z-index:90; background:rgba(29,26,23,0.32); display:flex; align-items:center; justify-content:center; padding:20px; animation:fade 0.2s ease;}
  .sheet{width:100%; max-width:520px; max-height:86svh; overflow:auto; background:var(--surface); border-radius:22px; padding:24px; box-shadow:0 30px 80px rgba(0,0,0,0.25); animation:sheetIn 0.32s cubic-bezier(.2,.8,.2,1);}
  .sheet h3{font-size:1.2rem; margin-bottom:8px;}
  .sheet ul{margin:10px 0 18px 18px; color:var(--ink-2); font-size:0.88rem;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  @keyframes sheetIn{from{opacity:0; transform:translateY(16px) scale(0.98);} to{opacity:1; transform:none;}}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:100; background:rgba(29,26,23,0.9); color:#fff; padding:11px 18px; border-radius:999px; font-size:0.88rem; box-shadow:0 10px 30px rgba(0,0,0,0.25); animation:sheetIn 0.3s cubic-bezier(.2,.8,.2,1);}
  .spinner{width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,0.35); border-top-color:#fff; animation:spin 0.8s linear infinite;}
  .btn.secondary .spinner{border-color:rgba(0,0,0,0.15); border-top-color:var(--ink);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading{padding:40px; text-align:center; color:var(--ink-3);}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }
  @media (prefers-reduced-transparency: reduce){ .side, .topbar, .thumb-menu{background:var(--bg); -webkit-backdrop-filter:none; backdrop-filter:none;} }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-card">
    <img src="https://res.cloudinary.com/drfoww3ch/image/upload/w_112,h_112,c_pad,b_rgb:221D18,f_png/Firma_Blanca_gc6x1k.png" alt="">
    <h1>Panel de la web</h1>
    <p>The Wedding Project</p>
    <form id="loginForm">
      <input class="field" type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" required>
      <button class="btn" type="submit" id="loginBtn">Entrar</button>
      <div class="error" id="loginErr"></div>
    </form>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><img src="https://res.cloudinary.com/drfoww3ch/image/upload/w_60,h_60,c_pad,b_rgb:221D18,f_png/Firma_Blanca_gc6x1k.png" alt=""><div><b>The Wedding Project</b><span>Panel de la web</span></div></div>
    <button class="nav-item" data-view="textos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Textos</button>
    <button class="nav-item" data-view="precios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Precios</button>
    <button class="nav-item" data-view="faq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>Preguntas frecuentes</button>
    <button class="nav-item" data-view="galerias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>Galerías</button>
    <button class="nav-item" data-view="blog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Blog</button>
    <div class="side-foot">Los cambios se juntan y se publican todos juntos con <b>Publicar</b>: un solo deploy en Netlify.<br><br><a href="/" target="_blank" rel="noopener">Ver la web ↗</a></div>
  </aside>
  <section class="main">
    <header class="topbar">
      <h2 id="viewTitle">Textos</h2>
      <span class="pending" id="pending"><span class="dot"></span><span id="pendingText">Sin cambios</span></span>
      <button class="btn secondary small" id="previewBtn" hidden>Vista previa</button>
      <button class="btn secondary small" id="discardBtn" hidden>Descartar</button>
      <button class="btn small" id="publishBtn" disabled>Publicar</button>
    </header>
    <div class="content" id="view"></div>
  </section>
</div>

<script src="/panel/cms-core.js"></script>
<script src="/panel/gallery-gen.js"></script>
<script src="/panel/app.js"></script>
</body>
</html>
